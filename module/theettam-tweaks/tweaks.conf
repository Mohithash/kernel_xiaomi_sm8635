# Theettam Tweaks — every lever is independent, reversible, and safe by default.
# Edit a value and reboot to apply (or tap the module's Action button to cycle PROFILE).
# Uninstall the module + reboot to return to 100% stock behaviour.

# Profile bundle: battery | balanced | performance   (balanced = default)
#   battery      = VM/IO tuned for power + screen-off prime-CPU cap + trip on
#   balanced     = VM/IO tuned, no CPU cap, trip on (screen-off only)
#   performance  = higher min freqs / readahead, trip off
PROFILE=balanced

# --- A. Screen-off wakelock trip (the biggest battery lever) ---
# Blocks data-path (IPA/RMNET) wakelocks ONLY while the screen is off.
# Calls, SMS, alarms and modem paging are NOT in this list, so they still wake you.
# Unblocks whenever the screen is on or the phone is charging.
trip=1
trip_poll=15
trip_unblock_on_charger=1
trip_list=IPA_WS;IPA_CLIENT_APPS_WAN_COAL_CONS;IPA_CLIENT_APPS_WAN_LOW_LAT_CONS;IPA_CLIENT_APPS_LAN_CONS;rmnet_ipa%d;rmnet_ctl;RMNET_SHS;hal_bluetooth_lock

# --- B. VM + I/O tuning (static sysctls applied at boot) ---
# watermark/swappiness/page-cluster/dirty-writeback/readahead tuned per PROFILE.
vmtune=1

# --- C. Hide custom-ROM property residue ---
# Removes ro.modversion (leaks VoltageOS/LineageOS identity to detection apps).
# Harmless — nothing in the system reads it at runtime.
hide_rom_props=1
